<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-appraisal alpha</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Paste items to be appraised</h1>
    <p>Use either copy of in-game inventory in 'icons' mode (CTRL+A, CTRL+C) or exported shopping list from EVE ISK Per Hour program</p>
    <form action="/process_data" method="post">
        <textarea name="data" rows="10" cols="50"></textarea><br>
        <label for="data_format">Pasted text is:</label>
        <select name="data_format" id="data_format">
            <option value="eve_inventory">EVE Inventory</option>
            <option value="csv">EVE-IPH CSV</option>
        </select><br>
        <label for="user_wants_to" title="Select whether you want to buy or sell">I want to:</label>
        <select name="user_wants_to" id="user_wants_to" title="Select whether you want to buy or sell">
            <option value="buy">Buy</option>
            <option value="sell">Sell</option>
        </select><br>
        <label for="order_type">Using order type:</label>
        <select name="order_type" id="order_type">
            <option value="buy">Buy</option>
            <option value="sell">Sell</option>
        </select><br>
        <input type="submit" value="Process Data">
    </form>
</body>
</html>
